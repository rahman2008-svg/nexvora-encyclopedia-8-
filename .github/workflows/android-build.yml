name: Build NexVora Encyclopedia 8 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify Python
        run: |
          python3 --version
          which python3
          python3 -c "import sys; print(sys.executable)"

      - name: Install Python dependencies
        run: |
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt
          fi

          if [ -f scripts/requirements.txt ]; then
            python3 -m pip install -r scripts/requirements.txt
          fi

      - name: Verify Gradle
        run: ./gradlew --version

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Generate debug keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Validate encyclopedia generator
        run: |
          echo "Python files:"
          find . -type f -name "*.py" -print

          echo ""
          echo "Generator references:"
          grep -Rni \
            --exclude-dir=.git \
            --exclude-dir=.gradle \
            "generate_encyclopedia_db" \
            . || true

      - name: Generate Encyclopedia Database
        run: |
          ./gradlew :app:generateEncyclopediaDatabase \
            --no-daemon \
            --rerun-tasks \
            --stacktrace

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find generated APK
        run: |
          echo "Generated APK files:"
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexvora-encyclopedia-8-debug-apk
          path: app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 14
