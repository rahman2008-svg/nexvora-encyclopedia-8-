name: Build NexVora Encyclopedia 8 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: |
          ./gradlew :app:generateEncyclopediaDatabase \
            --no-daemon \
            --rerun-tasks \
            --stacktrace

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        run: find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexvora-encyclopedia-8-debug-apk
          path: app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 14
